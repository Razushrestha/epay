name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, catches newly published CVEs even without code changes

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm audit (all dependencies, fail on moderate and above)
        run: npm audit --audit-level=moderate
      - name: Security unit tests (rate limiting, CORS, headers, config guard)
        run: node --test server/security-hardening.test.mjs server/security-cors.test.mjs server/rate-limit-login.test.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
