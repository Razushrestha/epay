services:
  - type: web
    name: nexlo-backend
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NEXLO_ADMIN_SECRET
        sync: false
      - key: TRUST_PROXY
        value: 1
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: ESEWA_SUCCESS_URL
        sync: false
      - key: ESEWA_FAILURE_URL
        sync: false
      - key: KHALTI_RETURN_URL
        sync: false
      # Email (Resend). Domain must be verified in Resend; EMAIL_FROM must use that domain.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Next.js website (meroauction.com). Browser calls /api/v1/* on this origin and
  # next.config.ts rewrites them to the backend service above.
  - type: web
    name: meroauction-web
    runtime: node
    region: ohio
    plan: starter # the free plan (512 MB) can run out of memory during `next build`
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      # Public URL of the backend service, e.g. https://api.meroauction.com
      - key: API_PROXY_TARGET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
