# nginx site for meroauction.com (website + API + uploaded images on one server).
# Install:  cp deploy/vps/nginx-meroauction.conf /etc/nginx/sites-available/meroauction
# HTTPS:    certbot --nginx -d meroauction.com -d www.meroauction.com   (adds the 443 block and redirect)

# Per-IP request limit for the API. The application has its own login/OTP limits on top of this.
limit_req_zone $binary_remote_addr zone=mero_api:10m rate=30r/s;

upstream mero_web { server 127.0.0.1:3000; keepalive 16; }
upstream mero_api { server 127.0.0.1:4000; keepalive 16; }

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.meroauction.com;
    return 301 https://meroauction.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name meroauction.com;

    server_tokens off;
    client_max_body_size 1m;          # default for the website; the API location below allows photo uploads
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # Never serve hidden files (.env, .git, ...). Let's Encrypt validation is the only exception.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Uploaded product photos and avatars. Written by the API, served directly from disk.
    # (KYC documents are NOT here: they live in /var/lib/meroauction/data and are only served by the API.)
    location /uploads/ {
        alias /var/lib/meroauction/uploads/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # API. Sent straight to the Node API (skips the Next.js rewrite, and the API sees the real client IP).
    location /api/v1/ {
        limit_req zone=mero_api burst=60 nodelay;
        client_max_body_size 12m;     # product photos are limited to 10 MB in the API
        proxy_pass http://mero_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (do not append) so a client cannot spoof its IP. The API runs with TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Website (Next.js)
    location / {
        proxy_pass http://mero_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
